[project]
name = "summer-schedule"
version = "0.1.0"
description = "暑假日程安排 — 交互式日历网页"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
serve = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]

[tool.uv]
package = true
